[project]
name = "etl-tasks"
version = "0.1.0"
description = "Invoice ETL task bodies, executed by $ETL_PYTHON"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
